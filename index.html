<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="民间文艺赋能乡风文明建设研究数据库">
  <title>民间文艺赋能乡风文明建设研究数据库</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css?v=2ea32c6">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div class="school-mark"><span>南农</span> 南京农业大学 · 社会学系实践教学成果</div>
      <h1>民间文艺赋能乡风文明建设研究数据库</h1>
      <p class="editable-subtitle">南京农业大学社会学系吴桥镇田野调查成果平台</p>
      <div class="stats" id="heroStats" aria-label="数据库统计"></div>
    </div>
    <div class="sun" aria-hidden="true"></div>
    <div class="hill hill-back" aria-hidden="true"></div>
    <div class="hill hill-front" aria-hidden="true"></div>
    <nav class="primary-nav" aria-label="数据库主导航">
      <button data-view="literature" class="active">文献检索</button>
      <button data-view="association">协会概况</button>
      <button data-view="projects">特色实践项目</button>
      <button data-view="results">主要成效</button>
      <button data-view="gallery">影像库</button>
      <button data-view="map">村庄地图</button>
    </nav>
  </header>

  <main id="mainContent" tabindex="-1">
    <section id="literature" class="view active"></section>
    <section id="association" class="view"></section>
    <section id="projects" class="view"></section>
    <section id="results" class="view results-view"></section>
    <section id="gallery" class="view"></section>
    <section id="map" class="view"></section>
  </main>

  <button class="ai-fab" id="aiFab" aria-expanded="false">AI 问答</button>
  <aside class="ai-panel" id="aiPanel" aria-hidden="true">
    <div class="ai-head"><div><strong>资料库问答</strong><small>本地检索模式 · 未配置生成式 AI API</small></div><button id="aiClose" aria-label="关闭">×</button></div>
    <div class="ai-messages" id="aiMessages"><p class="ai-answer">请输入协会、项目、村庄或文献关键词。我会返回资料库中最相关的记录和出处，不会编造答案。</p></div>
    <form id="aiForm"><input id="aiInput" placeholder="例如：公益国学讲堂有哪些课程？"><button>检索</button></form>
  </aside>

  <dialog id="readerDialog" class="reader-dialog"><button class="dialog-close" data-close="readerDialog">×</button><article id="readerBody"></article></dialog>
  <dialog id="lightbox" class="lightbox"><button class="dialog-close" data-close="lightbox">×</button><button id="prevImage" class="lightbox-nav prev">‹</button><figure><img id="lightboxImage" alt=""><figcaption id="lightboxCaption"></figcaption></figure><button id="nextImage" class="lightbox-nav next">›</button></dialog>
  <dialog id="uploadDialog" class="upload-dialog">
    <button class="dialog-close" data-close="uploadDialog" aria-label="关闭">×</button>
    <form id="uploadForm">
      <p class="section-label">村庄实景资料补充</p>
      <h2>上传待审核资料</h2>
      <p class="upload-intro">选择照片、视频或全景影像并填写说明。当前为公开静态网站，资料会先在本机生成提交清单，不会未经审核直接公开。</p>
      <div class="upload-form-grid">
        <label><span>所属村庄</span><select id="uploadVillage" required></select></label>
        <label><span>资料类型</span><select id="uploadType"><option>照片</option><option>视频</option><option>全景影像</option><option>其他</option></select></label>
        <label><span>拍摄日期</span><input id="uploadDate" type="date"></label>
        <label class="upload-wide"><span>选择文件</span><input id="uploadFiles" type="file" accept="image/*,video/*" multiple required></label>
        <div id="uploadFileList" class="upload-file-list upload-wide">尚未选择文件</div>
        <label class="upload-wide"><span>内容说明</span><textarea id="uploadNote" rows="4" placeholder="请说明拍摄地点、活动内容及资料来源。"></textarea></label>
      </div>
      <div class="upload-actions"><button type="button" class="link-button" data-close="uploadDialog">取消</button><button type="submit" class="primary-button">生成提交清单</button></div>
      <p id="uploadStatus" class="upload-status" aria-live="polite"></p>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js?v=2ea32c6"></script>
</body>
</html>
